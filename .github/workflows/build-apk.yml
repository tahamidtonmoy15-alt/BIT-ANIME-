name: Build BitAnime.pro v12 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v12 source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore exact BitAnime v12 HTML
        run: |
          set -euo pipefail
          cat index-html-parts/*.txt | base64 --decode > index.html.br
          node -e "const fs=require('fs');const z=require('zlib');fs.writeFileSync('index.html',z.brotliDecompressSync(fs.readFileSync('index.html.br')));"
          test -s index.html

      - name: Build Android APK
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/android@7
          npm install --no-save --no-audit --no-fund @capacitor/cli@7
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BitAnime-Pro-v12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitAnime-Pro-v12-APK
          path: BitAnime-Pro-v12.apk
          if-no-files-found: error
          retention-days: 30
