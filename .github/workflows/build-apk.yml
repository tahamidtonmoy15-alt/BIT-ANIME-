name: Build BitAnime APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
 njobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BitAnime-v1.0.${{ github.run_number }}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitAnime-debug-apk
          path: BitAnime-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error
      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BitAnime v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: BitAnime-v1.0.${{ github.run_number }}.apk
